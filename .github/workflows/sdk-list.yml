name: SDK list (diagnostic)

on:
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: List available SDK packages
        run: |
          SM="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n1)"
          echo "sdkmanager: $SM"
          "$SM" --list 2>/dev/null | grep -E "platforms;android-3[4-9]|build-tools;3[4-9]|ndk;2[7-9]|cmake;3" | head -60
          echo "--- installed ---"
          "$SM" --list_installed 2>/dev/null | head -40
